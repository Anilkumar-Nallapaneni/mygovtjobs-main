# Copy or symlink to .github/workflows/fetch-official-feeds.yml
name: Fetch official RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run fetch:official
        working-directory: .

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f frontend/public/data/official-feed-items.json ]; then
            echo "::error::official-feed-items.json was not generated"
            exit 1
          fi
          git add -f frontend/public/data/official-feed-items.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): refresh official RSS snapshot"
            git push
          fi
