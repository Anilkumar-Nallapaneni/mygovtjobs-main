# Copy or symlink to .github/workflows/fetch-official-feeds.yml
name: Fetch official RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */4 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 180 || 60 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Fetch official feeds
        env:
          FEED_FETCH_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && '8' || '12' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run fetch:official:feeds
          else
            npm run fetch:official:feeds -- --rss-only
          fi
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 150 || 45 }}

      - run: npm run build:official-archives

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f frontend/public/data/official-feed-items.json ]; then
            echo "::error::official-feed-items.json was not generated"
            exit 1
          fi
          git add -f frontend/public/data/official-feed-items.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): refresh official RSS snapshot"
            git push
          fi
