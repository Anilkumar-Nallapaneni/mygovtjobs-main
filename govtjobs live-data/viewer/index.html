<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GovtJobs Live Data — India & State Vacancies</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --border: #2d3a4f;
      --text: #e8edf5;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --green: #22c55e;
      --orange: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #1e3a5f 0%, #0f1419 100%);
    }
    header h1 { font-size: 1.35rem; font-weight: 700; }
    header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
    .stats {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      min-width: 120px;
    }
    .stat b { display: block; font-size: 1.4rem; color: var(--accent); }
    .stat span { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      padding: 1rem 1.5rem;
      align-items: center;
    }
    input, select {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    input { flex: 1; min-width: 200px; }
    .tabs { display: flex; gap: 0.5rem; }
    .tab {
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    main { padding: 0 1.5rem 2rem; }
    .grid { display: grid; gap: 0.75rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
    }
    .card h3 { font-size: 0.95rem; margin-bottom: 0.35rem; }
    .card h3 a { color: var(--text); text-decoration: none; }
    .card h3 a:hover { color: var(--accent); }
    .meta { font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge.live { background: #14532d; color: var(--green); }
    .badge.state { background: #1e3a5f; color: #93c5fd; }
    .pdfs { margin-top: 0.5rem; }
    .pdfs a {
      display: inline-block;
      margin: 0.2rem 0.4rem 0.2rem 0;
      font-size: 0.78rem;
      color: var(--orange);
      text-decoration: none;
    }
    .pdfs a:hover { text-decoration: underline; }
    .site-row {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; flex-wrap: wrap;
    }
    .status-ok { color: var(--green); }
    .status-error { color: var(--red); }
    .empty { text-align: center; padding: 3rem; color: var(--muted); }
    .loading { text-align: center; padding: 3rem; color: var(--muted); }
    footer {
      text-align: center; padding: 1rem;
      font-size: 0.75rem; color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <h1>GovtJobs Live Data</h1>
    <p>All India &amp; state government vacancies · official portals · PDF notifications</p>
  </header>

  <div class="stats" id="stats">
    <div class="stat"><b id="s-jobs">—</b><span>Live jobs</span></div>
    <div class="stat"><b id="s-pdfs">—</b><span>PDF links</span></div>
    <div class="stat"><b id="s-sites">—</b><span>Websites</span></div>
    <div class="stat"><b id="s-updated">—</b><span>Last sync</span></div>
  </div>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" data-view="jobs">Vacancies</button>
      <button class="tab" data-view="pdfs">All PDFs</button>
      <button class="tab" data-view="sites">Websites</button>
    </div>
    <select id="stateFilter"><option value="">All states</option></select>
    <select id="categoryFilter"><option value="">All categories</option></select>
    <input type="search" id="search" placeholder="Search title, source, department…" />
  </div>

  <main>
    <div id="content" class="loading">Loading live data…</div>
  </main>

  <footer>Official gov.in / nic.in sources only · Run <code>python run.py</code> to refresh</footer>

  <script>
    const DATA_BASE = "/output";
    let jobs = [], pdfs = [], websites = [], view = "jobs";

    async function load() {
      try {
        const [jobsRes, pdfsRes, sitesRes] = await Promise.all([
          fetch(`${DATA_BASE}/live-jobs.json`),
          fetch(`${DATA_BASE}/all-pdfs.json`),
          fetch(`${DATA_BASE}/websites.json`),
        ]);
        if (!jobsRes.ok) throw new Error("No data yet — run: python run.py");
        const jobsData = await jobsRes.json();
        const pdfsData = pdfsRes.ok ? await pdfsRes.json() : { pdfs: [] };
        const sitesData = sitesRes.ok ? await sitesRes.json() : { websites: [] };
        jobs = jobsData.items || [];
        pdfs = pdfsData.pdfs || [];
        websites = sitesData.websites || [];
        document.getElementById("s-jobs").textContent = jobs.length;
        document.getElementById("s-pdfs").textContent = pdfs.length;
        document.getElementById("s-sites").textContent = websites.length;
        document.getElementById("s-updated").textContent = (jobsData.generatedAt || "—").slice(0, 16).replace("T", " ");
        buildFilters();
        render();
      } catch (e) {
        document.getElementById("content").innerHTML =
          `<div class="empty"><p>${e.message}</p><p style="margin-top:1rem">cd "govtjobs live-data" && pip install -r requirements.txt && python run.py --limit 10</p></div>`;
      }
    }

    function buildFilters() {
      const states = [...new Set(jobs.map(j => j.stateName || j.state).filter(Boolean))].sort();
      const cats = [...new Set(jobs.map(j => j.category).filter(Boolean))].sort();
      const sf = document.getElementById("stateFilter");
      const cf = document.getElementById("categoryFilter");
      states.forEach(s => { const o = document.createElement("option"); o.value = s; o.textContent = s; sf.appendChild(o); });
      cats.forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = c; cf.appendChild(o); });
    }

    function filteredJobs() {
      const q = document.getElementById("search").value.toLowerCase();
      const st = document.getElementById("stateFilter").value;
      const cat = document.getElementById("categoryFilter").value;
      return jobs.filter(j => {
        if (st && (j.stateName || j.state) !== st) return false;
        if (cat && j.category !== cat) return false;
        if (q && !`${j.title} ${j.sourceName} ${j.category}`.toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function render() {
      const el = document.getElementById("content");
      if (view === "jobs") {
        const list = filteredJobs();
        if (!list.length) { el.innerHTML = '<div class="empty">No vacancies match filters</div>'; return; }
        el.innerHTML = '<div class="grid">' + list.slice(0, 500).map(j => `
          <article class="card">
            <h3><a href="${esc(j.link)}" target="_blank" rel="noopener">${esc(j.title)}</a></h3>
            <div class="meta">
              <span class="badge live">${j.status || "live"}</span>
              <span class="badge state">${esc(j.stateName || j.state || "All India")}</span>
              <span>${esc(j.sourceName || j.source)}</span>
              ${j.category ? `<span>${esc(j.category)}</span>` : ""}
            </div>
            ${(j.pdfUrls && j.pdfUrls.length) ? `<div class="pdfs">${j.pdfUrls.map(p =>
              `<a href="${esc(p)}" target="_blank" rel="noopener">📄 PDF</a>`).join("")}</div>` : ""}
          </article>
        `).join("") + '</div>';
        if (list.length > 500) el.innerHTML += `<p class="empty" style="padding:1rem">Showing 500 of ${list.length}</p>`;
      } else if (view === "pdfs") {
        const q = document.getElementById("search").value.toLowerCase();
        const list = pdfs.filter(p => !q || `${p.jobTitle} ${p.source}`.toLowerCase().includes(q));
        el.innerHTML = '<div class="grid">' + list.slice(0, 300).map(p => `
          <article class="card">
            <h3><a href="${esc(p.pdfUrl)}" target="_blank" rel="noopener">📄 ${esc(p.jobTitle || "PDF")}</a></h3>
            <div class="meta">
              <span>${esc(p.stateName || p.state || "")}</span>
              <span>${esc(p.source || "")}</span>
              ${p.jobLink ? `<a href="${esc(p.jobLink)}" target="_blank" style="color:var(--accent)">Job page</a>` : ""}
            </div>
          </article>
        `).join("") + '</div>';
      } else {
        const q = document.getElementById("search").value.toLowerCase();
        const list = websites.filter(w => !q || `${w.name} ${w.code}`.toLowerCase().includes(q));
        el.innerHTML = '<div class="grid">' + list.map(w => `
          <article class="card site-row">
            <div>
              <h3>${esc(w.name)}</h3>
              <div class="meta">
                <span class="badge state">${esc(w.stateName || w.state)}</span>
                <span>${w.jobCount || 0} jobs · ${w.pdfCount || 0} PDFs</span>
                <span class="${w.status === 'ok' ? 'status-ok' : 'status-error'}">${w.status}</span>
              </div>
            </div>
            <div>
              ${w.portalUrl ? `<a href="${esc(w.portalUrl)}" target="_blank" style="color:var(--accent);font-size:0.85rem">Portal ↗</a>` : ""}
              ${w.feedUrl ? ` · <a href="${esc(w.feedUrl)}" target="_blank" style="color:var(--accent);font-size:0.85rem">RSS ↗</a>` : ""}
            </div>
          </article>
        `).join("") + '</div>';
      }
    }

    function esc(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
    }

    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        view = btn.dataset.view;
        render();
      });
    });
    ["search", "stateFilter", "categoryFilter"].forEach(id => {
      document.getElementById(id).addEventListener("input", render);
      document.getElementById(id).addEventListener("change", render);
    });

    load();
  </script>
</body>
</html>
