name: Scheduled API ingest

# Deprecated — production uses supabase-auto-ingest.yml → npm run sync:production.
# Manual only when triggering hosted FastAPI /api/admin/ingest/run-all.

on:
  workflow_dispatch:

concurrency:
  group: live-jobs-publication
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend ingest
        env:
          API_URL: ${{ secrets.MYGOVTJOBS_API_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$ADMIN_KEY" ]; then
            echo "Skip: set MYGOVTJOBS_API_URL and ADMIN_API_KEY repository secrets."
            exit 0
          fi
          URL="${API_URL%/}/api/admin/ingest/run-all"
          echo "POST $URL"
          HTTP=$(curl -sS -o /tmp/ingest.json -w "%{http_code}" \
            -X POST "$URL" \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -H "Content-Type: application/json")
          echo "HTTP $HTTP"
          cat /tmp/ingest.json
          test "$HTTP" -ge 200 -a "$HTTP" -lt 300
