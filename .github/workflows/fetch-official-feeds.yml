name: Fetch official RSS

on:
  workflow_dispatch:
  schedule:
    # Refresh the Official Wire & Notices snapshot every 4 hours.
    - cron: "30 */4 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch official RSS snapshot
        run: node scripts/fetch-official-feeds.mjs
        timeout-minutes: 45

      - name: Build official archives
        run: npm run build:official-archives

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f frontend/public/data/official-feed-items.json ]; then
            echo "::error::official-feed-items.json was not generated"
            exit 1
          fi
          # File is gitignored locally but must ship to Vercel via the repo.
          git add -f frontend/public/data/official-feed-items.json
          if [ -d frontend/public/data/official-archives ]; then
            git add frontend/public/data/official-archives/
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): refresh official RSS snapshot"
            git push
          fi

  notify-failure:
    needs: fetch
    if: failure()
    uses: ./.github/workflows/notify-on-failure.yml
    secrets: inherit
