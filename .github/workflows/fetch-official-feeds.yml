name: Fetch official RSS

on:
  workflow_dispatch:
  schedule:
    # Refresh the Official Wire & Notices snapshot every 4 hours.
    - cron: "30 */4 * * *"

concurrency:
  group: official-rss-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        timeout-minutes: 10

      - name: Fetch official RSS snapshot
        run: >
          node scripts/fetch-official-feeds.mjs
          --rss-only
          --merge-existing
          --request-timeout-ms=18000
          --request-retries=1
          --source-timeout-ms=75000
          --max-runtime-minutes=25
        timeout-minutes: 30

      - name: Build official archives
        run: npm run build:official-archives
        timeout-minutes: 10

      - name: Validate snapshot output
        run: |
          node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('frontend/public/data/official-feed-items.json','utf8')); if(!Array.isArray(data.items)||data.items.length===0){throw new Error('official-feed-items.json is empty')} console.log('Snapshot items:', data.items.length)"

      - name: Commit snapshot
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f frontend/public/data/official-feed-items.json ]; then
            echo "::error::official-feed-items.json was not generated"
            exit 1
          fi
          # File is gitignored locally but must ship to Vercel via the repo.
          git add -f frontend/public/data/official-feed-items.json
          if [ -d frontend/public/data/official-archives ]; then
            git add frontend/public/data/official-archives/
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): refresh official RSS snapshot"
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
            if ! git push origin "HEAD:${BRANCH}"; then
              echo "Push rejected once — rebasing latest remote changes and retrying..."
              git fetch origin "${BRANCH}"
              git rebase "origin/${BRANCH}"
              git push origin "HEAD:${BRANCH}"
            fi
          fi

  notify-failure:
    needs: fetch
    if: failure()
    uses: ./.github/workflows/notify-on-failure.yml
    secrets: inherit
