name: Fetch official RSS

on:
  workflow_dispatch:
  schedule:
    # Lightweight metadata refresh every 4 hours (sync:quick).
    - cron: "30 */4 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

# Share the write-lock with supabase-auto-ingest so the two workflows never
# push to main concurrently.
concurrency:
  group: live-jobs-publication
  cancel-in-progress: false

jobs:
  fetch:
    # RSS freshness is independent of the daily writer.
    # Disable with repository variable ALLOW_RSS_REFRESH=false if needed.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ALLOW_RSS_REFRESH != 'false' }}
    runs-on: ubuntu-latest
    # Manual runs scrape 53 admit/result portals; scheduled runs are RSS-only.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 180 || 60 }}
    env:
      AUTO_PUBLISH_VERIFIED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt

      - name: Configure DATABASE_URL from secrets
        env:
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_REGION: ${{ secrets.SUPABASE_DB_REGION }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            node scripts/build-database-url-for-actions.mjs
          elif [ -n "$SECRET_DATABASE_URL" ]; then
            echo "DATABASE_URL=$SECRET_DATABASE_URL" >> "$GITHUB_ENV"
          fi

      - name: sync:quick (RSS + archives)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SYNC_TRIGGER_TYPE: github_actions_schedule
          FEED_FETCH_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && '8' || '12' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Full fetch (RSS + admit/result portals)"
            node scripts/run-python.mjs scripts/run-sync-quick.py
          else
            echo "Scheduled RSS-only fetch (skips 53 portal scrapes)"
            node scripts/run-python.mjs scripts/run-sync-quick.py --rss-only
          fi
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 150 || 45 }}

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f frontend/public/data/official-feed-items.json ]; then
            echo "::error::official-feed-items.json was not generated"
            exit 1
          fi

          # File is gitignored locally but must ship to Vercel via the repo.
          git add -f frontend/public/data/official-feed-items.json

          if [ -d frontend/public/data/official-archives ]; then
            git add frontend/public/data/official-archives/
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            # [skip ci] avoids GitHub CI; ignoreBuildStep in vercel.json skips Vercel
            # when only RSS/archives change (prevents redeploying a stale/broken snapshot).
            git commit -m "chore(data): refresh official RSS snapshot [skip ci]"
            git fetch origin
            if ! git push; then
              echo "Push rejected — rebasing on remote and retrying..."
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || git pull --rebase -X theirs
              git push
            fi
          fi

  notify-failure:
    needs: fetch
    if: failure()
    uses: ./.github/workflows/notify-on-failure.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
