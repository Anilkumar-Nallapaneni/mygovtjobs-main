name: Supabase auto ingest

on:
  schedule:
    # Daily 02:30 UTC (~8:00 AM IST)
    - cron: "30 2 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

# One ingest at a time — do not cancel an in-flight run when a new schedule fires.
concurrency:
  group: supabase-auto-ingest
  cancel-in-progress: false

jobs:
  ingest:
    # PRODUCTION FREEZE: set repository variable ALLOW_AUTO_INGEST=true to re-enable.
    if: ${{ vars.ALLOW_AUTO_INGEST == 'true' }}
    runs-on: ubuntu-latest
    # No artificial timeout — use GitHub's hard ceiling (6h). Prefer finishing the
    # full scrape/export over failing early; tighten later only if runs hang.
    timeout-minutes: 360
    env:
      # Re-enabled 2026-07-26: freeze demoted all rows to draft and blocked export.
      # Keep publish gate (RECRUITMENT + completeness + URLs) — only verified-quality rows go live.
      AUTO_PUBLISH_VERIFIED: "1"
      APP_ENV: production
    steps:
      - name: Start
        run: echo "=== Daily ingest started at $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          echo "=== $(date -u +%H:%M:%S) install ==="
          npm ci
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt

      - name: Configure DATABASE_URL from secrets
        env:
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_REGION: ${{ secrets.SUPABASE_DB_REGION }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "Building DATABASE_URL from pooler secrets..."
            node scripts/build-database-url-for-actions.mjs
          elif [ -n "$SECRET_DATABASE_URL" ]; then
            echo "Using DATABASE_URL secret directly"
            echo "DATABASE_URL=$SECRET_DATABASE_URL" >> "$GITHUB_ENV"
          fi

      - name: Validate secrets
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Alert secrets optional — ingest must not require Resend/Telegram to run.
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::No database credentials. Add DATABASE_URL or SUPABASE_PROJECT_REF + SUPABASE_DB_PASSWORD"
            exit 1
          fi
          node scripts/check-github-actions-secrets.mjs

      - name: Test database
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          GITHUB_ACTIONS: "true"
        run: node scripts/run-python.mjs scripts/test-backend-db.py

      # ~100 scrapers — production canonical command (advisory lock + sync_runs)
      - name: sync:production
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          DAILY_SYNC_ENFORCE_ONCE: "1"
          ALLOW_FALLBACK_JSON_EXPORT: "0"
          ALERT_SITE_URL: ${{ secrets.ALERT_SITE_URL }}
          SYNC_TRIGGER_TYPE: github_actions_schedule
          # Force so a prior cancelled run (stuck "running" state) cannot skip today.
          SYNC_FORCE: "1"
          # Higher concurrency finishes the ~154-source scrape faster (each source still
          # has its own 120s timeout). Combined with the wall-clock budget below.
          SYNC_CONCURRENCY: "8"
          # Stop scraping after 4h and export/commit what we have — leaves ~2h for import,
          # scrub, export, audits and commit under GitHub's 6h hard cancel.
          SYNC_INGEST_BUDGET_SECONDS: "14400"
        run: |
          echo "=== $(date -u +%H:%M:%S) sync:production ==="
          node scripts/run-python.mjs scripts/run-sync-production.py

      # If the runner is killed (timeout/cancel), mark file + DB so the next run is not stuck.
      - name: Mark sync failed on cancel/timeout
        if: cancelled()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SYNC_FAIL_REASON: GitHub Actions cancelled or timed out before sync finished
        run: node scripts/run-python.mjs scripts/mark-daily-sync-failed.py

      # Job detail pages load from Supabase first; static PDF files are built weekly.
      # Do NOT run build:job-details or enrich:jobs:all here — they take hours.

      - name: Deliver job alerts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_SITE_URL: ${{ secrets.ALERT_SITE_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          PUSH_WEBHOOK_URL: ${{ secrets.PUSH_WEBHOOK_URL }}
          ALERT_DELIVERY_AFTER_SYNC: "1"
        run: node scripts/run-python.mjs scripts/run-alert-delivery.py

      - name: Data quality audits
        env:
          JOBS_AUDIT_STRICT: "1"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          mkdir -p frontend
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' \
            "$VITE_SUPABASE_URL" "$VITE_SUPABASE_ANON_KEY" > frontend/.env.local
          npm run supabase:audit
          npm run jobs:audit:strict

      - name: Commit daily data (live-jobs only — not 1900+ detail files)
        env:
          BRANCH: ${{ github.ref_name }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "=== $(date -u +%H:%M:%S) commit ==="
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage live-job snapshot only. official-archives / official-feed-items are owned by
          # fetch-official-feeds.yml — committing them here races the 4h RSS workflow and causes
          # rebase conflicts that drop the day's snapshot push.
          for path in \
            frontend/public/data/live-jobs.json \
            frontend/public/data/live-jobs-list.json \
            frontend/public/data/live-jobs-bootstrap.json \
            frontend/public/data/daily-sync-state.json \
            frontend/public/data/org-index.json \
            frontend/public/sitemap.xml \
            frontend/public/sitemaps/; do
            if [ -e "$path" ]; then
              git add "$path"
            else
              echo "Skip missing: $path"
            fi
          done
          if git diff --staged --quiet; then
            echo "No static data changes to commit."
            exit 0
          fi
          # Guard: never push a zero-vacancy snapshot (breaks Vercel strict build).
          # If the sync export somehow wiped vacancies, re-export from DB once and retry.
          if ! node scripts/verify-live-jobs-snapshot.mjs --strict; then
            echo "::warning::Snapshot failed strict verify — re-exporting from Supabase and retrying"
            npm run export:live-jobs
            npm run clean:live-jobs
            git add frontend/public/data/live-jobs.json \
              frontend/public/data/live-jobs-list.json \
              frontend/public/data/live-jobs-bootstrap.json || true
            if ! node scripts/verify-live-jobs-snapshot.mjs --strict; then
              echo "::error::Refusing to commit broken live-jobs snapshot (0 vacancies or other strict failure)"
              exit 1
            fi
          fi
          git commit -m "chore: daily job sync [skip ci]"
          git fetch origin "${BRANCH}"
          if ! git push origin "HEAD:${BRANCH}"; then
            echo "Push rejected — rebasing on remote and retrying..."
            git stash push -u -m "ingest-leftovers" || true
            # Prefer our snapshot files if RSS commits touched unrelated paths.
            git rebase -X ours "origin/${BRANCH}" || {
              echo "::error::Rebase failed after push rejection"
              git rebase --abort || true
              git stash pop || true
              exit 1
            }
            git push origin "HEAD:${BRANCH}"
            git stash drop || true
          fi
          echo "=== Finished at $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

  notify-failure:
    needs: ingest
    if: failure()
    uses: ./.github/workflows/notify-on-failure.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
