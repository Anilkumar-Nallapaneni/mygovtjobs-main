name: Supabase auto ingest (legacy)

# DEPRECATED daily writer.
# Canonical production ingest is: .github/workflows/canonical-daily-pipeline.yml
# Keep this file only for emergency manual re-runs of the old sync:production path.
# Do NOT re-enable the schedule while ALLOW_CANONICAL_PIPELINE is true.

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: live-jobs-publication
  cancel-in-progress: false

jobs:
  ingest:
    # Hard-disabled. Use Canonical daily pipeline instead.
    # To emergency-run legacy sync: temporarily set if to true and use workflow_dispatch.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AUTO_PUBLISH_VERIFIED: "1"
      APP_ENV: production
    steps:
      - name: Start
        run: echo "=== Legacy daily ingest (manual only) started at $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt

      - name: Configure DATABASE_URL from secrets
        env:
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_REGION: ${{ secrets.SUPABASE_DB_REGION }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            node scripts/build-database-url-for-actions.mjs
          elif [ -n "$SECRET_DATABASE_URL" ]; then
            echo "DATABASE_URL=$SECRET_DATABASE_URL" >> "$GITHUB_ENV"
          fi

      - name: Validate secrets
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::No database credentials. Add DATABASE_URL or SUPABASE_PROJECT_REF + SUPABASE_DB_PASSWORD"
            exit 1
          fi
          node scripts/check-github-actions-secrets.mjs

      - name: Test database
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          GITHUB_ACTIONS: "true"
        run: node scripts/run-python.mjs scripts/test-backend-db.py

      - name: sync:production
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          DAILY_SYNC_ENFORCE_ONCE: "1"
          ALLOW_FALLBACK_JSON_EXPORT: "0"
          ALERT_SITE_URL: ${{ secrets.ALERT_SITE_URL }}
          SYNC_TRIGGER_TYPE: github_actions_legacy_manual
          SYNC_FORCE: "1"
          SYNC_CONCURRENCY: "8"
          SYNC_INGEST_BUDGET_SECONDS: "14400"
        run: node scripts/run-python.mjs scripts/run-sync-production.py

      - name: Mark sync failed on cancel/timeout
        if: cancelled()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SYNC_FAIL_REASON: GitHub Actions cancelled or timed out before sync finished
        run: node scripts/run-python.mjs scripts/mark-daily-sync-failed.py

      - name: Deliver job alerts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_SITE_URL: ${{ secrets.ALERT_SITE_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          PUSH_WEBHOOK_URL: ${{ secrets.PUSH_WEBHOOK_URL }}
          ALERT_DELIVERY_AFTER_SYNC: "1"
        run: node scripts/run-python.mjs scripts/run-alert-delivery.py

      - name: Data quality audits
        continue-on-error: true
        env:
          JOBS_AUDIT_STRICT: "1"
          JOBS_AUDIT_MIN_LIVE: "15"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          mkdir -p frontend
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' \
            "$VITE_SUPABASE_URL" "$VITE_SUPABASE_ANON_KEY" > frontend/.env.local
          npm run supabase:audit
          npm run jobs:audit:strict
          npm run audit:live-jobs -- --skip-links

      - name: Commit daily data
        env:
          BRANCH: ${{ github.ref_name }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/live-jobs*.json frontend/public/data/daily-sync-state.json frontend/public/sitemap.xml frontend/public/sitemaps || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: legacy manual job sync [skip ci]"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"

  notify-failure:
    needs: ingest
    if: failure()
    uses: ./.github/workflows/notify-on-failure.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
