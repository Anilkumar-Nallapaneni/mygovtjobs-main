name: Weekly PDF enrich

# Heavy PDF work — separate from daily ingest so CI finishes in time.
on:
  schedule:
    - cron: "0 3 * * 0" # Sunday 8:30 AM IST
  workflow_dispatch:
    inputs:
      metadata_limit:
        description: "Jobs to pre-enrich in DB before PDF/detail stages"
        required: false
        default: "100"
      pdf_limit:
        description: "PDF reader job cap"
        required: false
        default: "50"
      detail_limit:
        description: "Job detail build cap"
        required: false
        default: "50"

concurrency:
  group: weekly-enrich-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      METADATA_LIMIT: ${{ github.event.inputs.metadata_limit || '100' }}
      PDF_LIMIT: ${{ github.event.inputs.pdf_limit || '50' }}
      DETAIL_LIMIT: ${{ github.event.inputs.detail_limit || '50' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt

      - name: Resolve DATABASE_URL from secrets
        env:
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_REGION: ${{ secrets.SUPABASE_DB_REGION }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          SUPABASE_POOLER_PORT: ${{ secrets.SUPABASE_POOLER_PORT }}
        run: |
          node scripts/build-database-url-for-actions.mjs

      - name: Validate weekly enrich secrets
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/diagnose-database-url.mjs
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Missing required secret: VITE_SUPABASE_URL"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing required secret: SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

      - name: Test database
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          GITHUB_ACTIONS: "true"
        run: node scripts/run-python.mjs scripts/test-backend-db.py

      - name: Enrich DB metadata
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          if [ -z "$METADATA_LIMIT" ]; then
            echo "::error::metadata_limit is empty"
            exit 1
          fi
          node scripts/run-python.mjs scripts/enrich-jobs-metadata.py --limit "$METADATA_LIMIT"
        timeout-minutes: 30

      - name: PdfReaderAgent
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$PDF_LIMIT" ]; then
            echo "::error::pdf_limit is empty"
            exit 1
          fi
          node scripts/run-python.mjs scripts/run-pdf-reader-agent.py --limit "$PDF_LIMIT" --concurrency 4
        timeout-minutes: 45

      - name: JobDetailAgent
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$DETAIL_LIMIT" ]; then
            echo "::error::detail_limit is empty"
            exit 1
          fi
          node scripts/run-python.mjs scripts/run-job-detail-agent.py --limit "$DETAIL_LIMIT" --concurrency 2
        timeout-minutes: 45

  notify-failure:
    needs: enrich
    if: failure()
    uses: ./.github/workflows/notify-on-failure.yml
    secrets: inherit
