name: Weekly portal audit

# Probe official portal URLs before users hit broken links.
on:
  schedule:
    - cron: "0 4 * * 0" # Sunday 9:30 AM IST (after weekly enrich)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: live-jobs-publication
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt

      - name: Configure DATABASE_URL from secrets
        env:
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_REGION: ${{ secrets.SUPABASE_DB_REGION }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            node scripts/build-database-url-for-actions.mjs
          elif [ -n "$SECRET_DATABASE_URL" ]; then
            echo "DATABASE_URL=$SECRET_DATABASE_URL" >> "$GITHUB_ENV"
          fi

      - name: Job apply-link probe
        if: env.DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: node scripts/run-python.mjs scripts/check-job-links.py --limit 80
        continue-on-error: true

      - name: Audit official portal URLs (strict ≤10% stale 404/410)
        env:
          PORTAL_AUDIT_STRICT: "1"
          PORTAL_AUDIT_MAX_FAIL_PCT: "10"
          PORTAL_AUDIT_CONCURRENCY: "10"
        run: npm run audit:official-sites:strict
        # Strict gate = stale deep links (404/410) only. Network timeouts on residential IPs are reported, not failed.
        # Report artifact is uploaded even when this step fails (fix latestUrl in officialSites.ts).

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-audit-${{ github.run_id }}
          path: scripts/data/site-audit.json
          if-no-files-found: warn

  notify-failure:
    needs: audit
    if: failure()
    uses: ./.github/workflows/notify-on-failure.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
